<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f7">
  <title>时间线</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #263238;
      background: #f3f5f7;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --ink: #263238;
      --muted: #71808a;
      --line: #c8d1d8;
      --blue: #2776c7;
    }

    * { box-sizing: border-box; }

    body { min-width: 320px; min-height: 100vh; margin: 0; }

    .app-layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
      height: 100vh;
      padding: 26px 16px;
      border-right: 1px solid #dce2e7;
      background: #fff;
    }

    .brand { padding: 0 10px; color: #263238; font-size: 17px; font-weight: 700; }
    .view-switch { display: grid; gap: 6px; }

    .view-switch button {
      min-height: 42px;
      padding: 0 12px;
      border-color: transparent;
      text-align: left;
      background: transparent;
    }

    .view-switch button[aria-current="page"] {
      border-color: #d8e8f6;
      color: #1e67a8;
      background: #edf5fc;
      font-weight: 650;
    }

    .main-content { min-width: 0; padding: 30px clamp(18px, 3vw, 44px) 40px; }
    .page { width: min(1420px, 100%); margin: 0 auto; }
    .page[hidden] { display: none; }

    #timeline-page:fullscreen,
    #timeline-page.is-fullscreen {
      width: 100vw;
      max-width: none;
      height: 100vh;
      margin: 0;
      padding: 26px clamp(18px, 3vw, 44px);
      overflow: auto;
      background: #f3f5f7;
    }

    #timeline-page:fullscreen .timeline-scroll,
    #timeline-page.is-fullscreen .timeline-scroll {
      display: grid;
      min-height: calc(100vh - 104px);
      align-content: center;
    }

    #timeline-page.is-fullscreen {
      position: fixed;
      z-index: 1000;
      inset: 0;
    }

    .page-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    h1 { margin: 0; font-size: 21px; font-weight: 650; }

    .count {
      padding: 3px 8px;
      border-radius: 3px;
      color: #2366a8;
      background: #e3effa;
      font-size: 11px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      padding: 0 0 14px;
      border-bottom: 1px solid #dce2e7;
    }

    .toolbar-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    button, input { font: inherit; }

    button {
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid #c8d2da;
      border-radius: 4px;
      color: #33434c;
      background: #fff;
      cursor: pointer;
    }

    button:hover { background: #f7fafc; border-color: #9eafb9; }
    button:focus-visible, input:focus-visible { outline: 3px solid #9bc9ef; outline-offset: 2px; }

    .primary {
      border-color: #246fb9;
      color: #fff;
      background: #2776c7;
    }

    .primary:hover { border-color: #1e609f; color: #fff; background: #2169ae; }
    .quiet { color: #63737d; }
    .danger { color: #a73737; }
    .danger:hover { color: #8f2727; background: #fff5f4; border-color: #e5b9b4; }

    .event-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: end;
      gap: 16px;
      padding: 18px 0 22px;
      border-bottom: 1px solid #dce2e7;
    }

    .event-form[hidden] { display: none; }

    label { display: grid; gap: 6px; color: #52616a; font-size: 12px; font-weight: 550; }

    input {
      width: 100%;
      min-width: 0;
      height: 38px;
      padding: 0 10px;
      border: 1px solid #c8d2da;
      border-radius: 4px;
      color: var(--ink);
      background: #fff;
    }

    input::placeholder { color: #a0abb2; }
    .form-actions { display: flex; gap: 8px; grid-column: 1 / -1; }

    .records-heading { margin: 24px 0 12px; font-size: 14px; font-weight: 650; }
    .records-list { display: grid; border-top: 1px solid #dce2e7; }
    .record-row {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(130px, .9fr) minmax(150px, .8fr) auto;
      align-items: center;
      gap: 14px;
      padding: 13px 4px;
      border-bottom: 1px solid #e6ebef;
    }

    .record-name { min-width: 0; color: #2b3941; font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
    .record-sub { display: block; margin-top: 4px; color: #77858e; font-size: 11px; font-weight: 400; }
    .record-cell { color: #52616a; font-size: 12px; overflow-wrap: anywhere; }
    .record-actions { display: flex; gap: 6px; }
    .record-actions button { min-height: 30px; padding: 0 8px; font-size: 12px; }

    .timeline-scroll {
      overflow-x: auto;
      overscroll-behavior-x: contain;
      padding: 16px 2px 24px;
      scrollbar-color: #b9c5cd transparent;
      scrollbar-width: thin;
    }

    .timeline {
      position: relative;
      width: 100%;
      min-width: 100%;
      height: 330px;
    }

    .timeline::before {
      position: absolute;
      top: 158px;
      right: 0;
      left: 0;
      height: 2px;
      background: var(--line);
      content: "";
    }

    .timeline-item {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 0;
    }

    .event-card {
      position: absolute;
      left: 0;
      width: 178px;
      min-height: 76px;
      padding: 11px 12px 10px;
      border: 1px solid #d8e0e5;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 2px 7px rgba(34, 53, 66, .055);
      overflow-wrap: anywhere;
      transform: translateX(-50%);
    }

    .event-card.top { bottom: 190px; }
    .event-card.bottom { top: 176px; }

    .event-card.top::after, .event-card.bottom::before {
      position: absolute;
      left: 50%;
      width: 1px;
      height: 19px;
      background: var(--event-color);
      content: "";
    }

    .event-card.top::after { top: 100%; }
    .event-card.bottom::before { bottom: 100%; }

    .event-title {
      display: block;
      margin: 0 0 5px;
      color: #26343d;
      font-size: 13px;
      font-weight: 650;
      line-height: 1.4;
    }

    .event-title::before {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin: 0 7px 2px 0;
      border-radius: 50%;
      background: var(--event-color);
      content: "";
    }

    .event-state {
      margin: 0 0 5px;
      color: #3e4d55;
      font-size: 12px;
      line-height: 1.35;
    }

    .event-dates {
      margin: 0;
      color: #75828a;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      line-height: 1.35;
    }

    .event-node {
      position: absolute;
      z-index: 1;
      top: 153px;
      left: 0;
      width: 10px;
      height: 10px;
      border: 2px solid #f3f5f7;
      border-radius: 50%;
      background: var(--event-color);
      box-shadow: 0 0 0 1px var(--event-color);
      transform: translateX(-50%);
    }

    .empty {
      display: grid;
      min-height: 250px;
      place-items: center;
      color: #77858e;
      font-size: 14px;
      text-align: center;
    }

    .footer-note { margin: 0; color: #87939a; font-size: 11px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @media (max-width: 900px) {
      .app-layout { grid-template-columns: 180px minmax(0, 1fr); }
      .record-row { grid-template-columns: minmax(0, 1fr) minmax(120px, .8fr) auto; }
      .record-row .record-cell:nth-child(3) { display: none; }
    }

    @media (max-width: 540px) {
      .app-layout { grid-template-columns: 62px minmax(0, 1fr); }
      .sidebar { align-items: center; gap: 20px; padding: 18px 6px; }
      .brand { padding: 0; font-size: 0; }
      .brand::after { content: "时"; font-size: 18px; }
      .view-switch { width: 100%; }
      .view-switch button { padding: 0; text-align: center; font-size: 0; }
      .view-switch button::first-letter { font-size: 16px; }
      .view-switch button[data-view="data"]::before { content: "填"; font-size: 15px; }
      .view-switch button[data-view="timeline"]::before { content: "线"; font-size: 15px; }
      .main-content { padding: 20px 14px 28px; }
      .section-heading { align-items: flex-start; flex-direction: column; }
      .timeline { height: 314px; }
      .timeline::before { top: 150px; }
      .event-node { top: 145px; }
      .event-card.top { bottom: 182px; }
      .event-card.bottom { top: 168px; }
      .event-card { width: 164px; }
      .event-form { grid-template-columns: 1fr; }
      .form-actions { grid-column: auto; }
      .record-row { grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
      .record-row .record-cell { display: none; }
    }
  </style>
</head>
<body>
  <main class="app-layout">
    <aside class="sidebar">
      <div class="brand">事件时间线</div>
      <nav class="view-switch" aria-label="页面切换">
        <button type="button" data-view="data" aria-current="page">填写数据</button>
        <button type="button" data-view="timeline">时间轴</button>
      </nav>
    </aside>

    <div class="main-content">
      <section class="page" id="data-page">
        <header class="section-heading">
          <h1>填写数据</h1>
          <div class="toolbar-actions">
            <button id="export-data" type="button">导出数据</button>
            <button id="import-data" type="button">导入数据</button>
            <input class="visually-hidden" id="import-file" type="file" accept="application/json,.json">
          </div>
        </header>

        <form class="event-form" id="event-form">
          <label>事件
            <input id="event-title" name="title" maxlength="100" placeholder="例如：方案评审" required>
          </label>
          <label>状态 / 持续时间
            <input id="event-state" name="state" maxlength="60" placeholder="例如：进行中 / 35天" required>
          </label>
          <label>开始日期
            <input id="event-start" name="start" type="date" required>
          </label>
          <label>截止日期
            <input id="event-end" name="end" type="date" required>
          </label>
          <div class="form-actions">
            <button class="primary" id="save-event" type="submit">添加事件</button>
            <button class="quiet" id="cancel-edit" type="button">清空</button>
          </div>
        </form>

        <h2 class="records-heading">已添加事件 <span class="count" id="event-count">0 个</span></h2>
        <div class="records-list" id="records-list"></div>
      </section>

      <section class="page" id="timeline-page" hidden>
        <header class="section-heading">
          <h1>时间轴</h1>
          <div class="toolbar-actions">
            <span class="count" id="timeline-count">0 个事件</span>
            <button id="fullscreen-toggle" type="button" aria-label="进入全屏">⛶ 全屏</button>
          </div>
        </header>
        <section class="timeline-scroll" aria-label="事件时间轴">
          <div class="timeline" id="timeline"></div>
        </section>
      </section>
    </div>
  </main>

  <script>
    const storageKey = "manual-timeline-events-v2";
    const palette = ["#2877c7", "#c24f54", "#33876d", "#c47a2c", "#765eb1", "#18879a"];
    const form = document.querySelector("#event-form");
    const titleInput = document.querySelector("#event-title");
    const stateInput = document.querySelector("#event-state");
    const startInput = document.querySelector("#event-start");
    const endInput = document.querySelector("#event-end");
    const timeline = document.querySelector("#timeline");
    const count = document.querySelector("#event-count");
    const timelineCount = document.querySelector("#timeline-count");
    const recordsList = document.querySelector("#records-list");
    const importFile = document.querySelector("#import-file");
    const dataPage = document.querySelector("#data-page");
    const timelinePage = document.querySelector("#timeline-page");
    const fullscreenToggle = document.querySelector("#fullscreen-toggle");
    const viewButtons = [...document.querySelectorAll("[data-view]")];
    let editingId = null;

    function validEvent(item) {
      return item && typeof item.title === "string" && item.title.trim() &&
        typeof item.state === "string" && item.state.trim() &&
        /^\d{4}-\d{2}-\d{2}$/.test(item.start) &&
        /^\d{4}-\d{2}-\d{2}$/.test(item.end) && item.start <= item.end;
    }

    function readEvents() {
      try {
        const value = JSON.parse(localStorage.getItem(storageKey) || "[]");
        return Array.isArray(value) ? value.filter(validEvent) : [];
      } catch {
        return [];
      }
    }

    function saveEvents(events) {
      localStorage.setItem(storageKey, JSON.stringify(events));
    }

    function makeElement(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function shortDate(value) {
      const [, month, day] = value.split("-");
      return `${Number(month)}.${Number(day)}`;
    }

    function utcDay(value) {
      const [year, month, day] = value.split("-").map(Number);
      return Date.UTC(year, month - 1, day) / 86400000;
    }

    function switchView(view) {
      const showTimeline = view === "timeline";
      dataPage.hidden = showTimeline;
      timelinePage.hidden = !showTimeline;
      viewButtons.forEach(button => {
        if (button.dataset.view === view) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      });
      if (showTimeline) render();
    }

    function syncFullscreenButton() {
      const active = document.fullscreenElement === timelinePage || timelinePage.classList.contains("is-fullscreen");
      fullscreenToggle.textContent = active ? "退出全屏" : "⛶ 全屏";
      fullscreenToggle.setAttribute("aria-label", active ? "退出全屏" : "进入全屏");
    }

    async function toggleFullscreen() {
      if (document.fullscreenElement === timelinePage) {
        await document.exitFullscreen();
        return;
      }
      if (timelinePage.classList.contains("is-fullscreen")) {
        timelinePage.classList.remove("is-fullscreen");
        syncFullscreenButton();
        render();
        return;
      }
      if (typeof timelinePage.requestFullscreen === "function") {
        try {
          await timelinePage.requestFullscreen();
          return;
        } catch {
          timelinePage.classList.add("is-fullscreen");
        }
      } else {
        timelinePage.classList.add("is-fullscreen");
      }
      syncFullscreenButton();
      render();
    }

    function renderRecords(events) {
      recordsList.replaceChildren();
      if (!events.length) {
        recordsList.append(makeElement("p", "empty", "尚未添加事件。"));
        return;
      }

      events.forEach(item => {
        const row = makeElement("div", "record-row");
        const title = makeElement("div", "record-name", item.title);
        const state = makeElement("div", "record-cell", item.state);
        const dates = makeElement("div", "record-cell", `${shortDate(item.start)} - ${shortDate(item.end)}`);
        const actions = makeElement("div", "record-actions");
        const edit = makeElement("button", "", "编辑");
        edit.type = "button";
        edit.addEventListener("click", () => beginEdit(item));
        const remove = makeElement("button", "danger", "删除");
        remove.type = "button";
        remove.addEventListener("click", () => {
          if (!window.confirm(`确定删除“${item.title}”吗？`)) return;
          saveEvents(readEvents().filter(event => event.id !== item.id));
          if (editingId === item.id) resetForm();
          render();
        });
        actions.append(edit, remove);
        row.append(title, state, dates, actions);
        recordsList.append(row);
      });
    }

    function render() {
      const events = readEvents().sort((a, b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end));
      timeline.replaceChildren();
      timelineCount.textContent = `${events.length} 个事件`;
      count.textContent = `${events.length} 个`;
      renderRecords(events);

      if (!events.length) {
        timeline.style.width = "100%";
        timeline.append(makeElement("p", "empty", "还没有事件。选择“添加事件”开始创建时间线。"));
        return;
      }

      const viewportWidth = timeline.parentElement.clientWidth;
      const firstDay = utcDay(events[0].start);
      const lastDay = utcDay(events[events.length - 1].start);
      const spanDays = Math.max(1, lastDay - firstDay);
      const scale = Math.min(2.2, Math.max(0.8, (viewportWidth - 220) / spanDays));
      const positions = [];
      events.forEach(item => {
        const datePosition = 100 + (utcDay(item.start) - firstDay) * scale;
        const separatedPosition = positions.length ? Math.max(datePosition, positions[positions.length - 1] + 205) : datePosition;
        positions.push(separatedPosition);
      });
      timeline.style.width = `${Math.max(viewportWidth, positions[positions.length - 1] + 100)}px`;

      events.forEach((item, index) => {
        const color = palette[index % palette.length];
        const wrapper = makeElement("article", "timeline-item");
        wrapper.style.setProperty("--event-color", color);
        wrapper.style.left = `${positions[index]}px`;
        const card = makeElement("div", `event-card ${index % 2 === 0 ? "top" : "bottom"}`);
        card.append(
          makeElement("strong", "event-title", item.title),
          makeElement("p", "event-state", item.state),
          makeElement("p", "event-dates", `${shortDate(item.start)} - ${shortDate(item.end)}`)
        );

        const node = makeElement("span", "event-node");
        node.setAttribute("aria-label", `${item.title}时间节点`);
        wrapper.append(card, node);
        timeline.append(wrapper);
      });
    }

    function showForm() {
      titleInput.focus();
    }

    function resetForm() {
      form.reset();
      editingId = null;
      document.querySelector("#save-event").textContent = "添加事件";
    }

    function beginEdit(item) {
      switchView("data");
      editingId = item.id;
      titleInput.value = item.title;
      stateInput.value = item.state;
      startInput.value = item.start;
      endInput.value = item.end;
      document.querySelector("#save-event").textContent = "保存修改";
      showForm();
      form.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    document.querySelector("#cancel-edit").addEventListener("click", resetForm);
    viewButtons.forEach(button => button.addEventListener("click", () => switchView(button.dataset.view)));
    fullscreenToggle.addEventListener("click", toggleFullscreen);
    document.addEventListener("fullscreenchange", () => {
      syncFullscreenButton();
      if (!timelinePage.hidden) render();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && timelinePage.classList.contains("is-fullscreen")) {
        timelinePage.classList.remove("is-fullscreen");
        syncFullscreenButton();
        render();
      }
    });

    form.addEventListener("submit", event => {
      event.preventDefault();
      if (startInput.value > endInput.value) {
        endInput.setCustomValidity("截止日期不能早于开始日期");
        endInput.reportValidity();
        endInput.setCustomValidity("");
        return;
      }

      const events = readEvents();
      const newId = window.crypto && typeof window.crypto.randomUUID === "function"
        ? window.crypto.randomUUID()
        : `${Date.now()}-${Math.random()}`;
      const record = {
        id: editingId || newId,
        title: titleInput.value.trim(),
        state: stateInput.value.trim(),
        start: startInput.value,
        end: endInput.value
      };
      const index = events.findIndex(item => item.id === editingId);
      if (index >= 0) events[index] = record;
      else events.push(record);
      saveEvents(events);
      resetForm();
      render();
    });

    document.querySelector("#export-data").addEventListener("click", () => {
      const file = new Blob([JSON.stringify(readEvents(), null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(file);
      const link = document.createElement("a");
      link.href = url;
      link.download = "timeline-events.json";
      link.click();
      URL.revokeObjectURL(url);
    });

    document.querySelector("#import-data").addEventListener("click", () => importFile.click());
    importFile.addEventListener("change", async () => {
      const file = importFile.files && importFile.files[0];
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        if (!Array.isArray(parsed) || !parsed.every(validEvent)) throw new Error("format");
        saveEvents(parsed.map(item => ({ ...item, id: item.id || `${Date.now()}-${Math.random()}` })));
        resetForm();
        render();
      } catch {
        window.alert("导入失败。请选择由此时间轴导出的 JSON 文件，并确认每条事件都包含事件、状态/持续时间、开始日期和截止日期。");
      } finally {
        importFile.value = "";
      }
    });

    window.addEventListener("resize", () => {
      if (!timelinePage.hidden) render();
    });
    render();
  </script>
</body>
</html>
